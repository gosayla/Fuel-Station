services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fuel_station
      POSTGRES_USER: fuel_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: fuel_user
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: fuel_station
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: 7d
      PORT: 3000
      NODE_ENV: production
      DB_SYNCHRONIZE: "true"
      CORS_ORIGIN: https://fuel.starfishumluj.com
    depends_on:
      - postgres
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
